<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Detect Calendar Event — Options</title>
    <link rel="stylesheet" type="text/css" media="screen" href="options.css">
</head>

<body>

<div class="options-container">
    <h1 data-i18n="optionsTitle"></h1>

    <div class="form-group">
        <label for="date-order" data-i18n="optionsDateOrderLabel"></label>
        <select id="date-order">
            <option value="MDY" data-i18n="optionsDateOrderMdy"></option>
            <option value="DMY" data-i18n="optionsDateOrderDmy"></option>
        </select>
    </div>

    <div class="form-group">
        <label for="calendar-select" data-i18n="optionsCalendarLabel"></label>
        <select id="calendar-select"></select>
        <p class="hint" data-i18n="optionsCalendarHint"></p>
    </div>

    <div class="form-group">
        <label for="default-duration" data-i18n="optionsDurationLabel"></label>
        <input type="number" id="default-duration" min="5" step="5">
    </div>

    <div class="form-group checkbox-group">
        <label>
            <input type="checkbox" id="business-hours-meridiem">
            <span data-i18n="optionsBusinessHoursLabel"></span>
        </label>
    </div>

    <div id="save-status" role="status"></div>
</div>


<script type="module" src="options.js"></script>
</body>

</html>
